services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-America/Denver}
    volumes:
      - ..:/workspace:cached
      - claude-code-bashhistory:/commandhistory
      - claude-code-config:/home/node/.claude
    # Keep the container alive so the devcontainer can attach.
    command: sleep infinity
    environment:
      # Inside the compose network, Postgres is reachable at host "db".
      DATABASE_URL: postgresql://postgres:postgres@db:5432/design_firm_ops
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: design_firm_ops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d design_firm_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  claude-code-bashhistory:
  claude-code-config:
