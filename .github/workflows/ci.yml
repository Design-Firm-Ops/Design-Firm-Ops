name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The tenant-isolation suite is a correctness gate and cannot prove
      # anything against a mock, so CI supplies a real Postgres.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dfo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dfo_ci
      # The isolation harness derives its own throwaway database from
      # DATABASE_URL, so it never touches this one.
      NEXTAUTH_SECRET: ci-secret-not-used-for-anything-real
      CREDENTIALS_ENCRYPTION_KEY: Q0kgdGVzdCBrZXkgLSAzMiBieXRlcyBleGFjdGx5ISEh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (unit + components + isolation)
        run: npm test

      # `npm test` stays green when the isolation suite skips, which is what
      # keeps a fresh clone usable — but in CI a skipped security gate is a
      # failure, not a pass. Run it alone and require that it actually
      # executed tests.
      - name: Assert the isolation gate actually ran
        run: |
          set -o pipefail
          npm run test:isolation 2>&1 | tee isolation.log
          if grep -q "TENANT-ISOLATION SUITE SKIPPED" isolation.log; then
            echo "::error::The tenant-isolation suite skipped. It is a correctness gate and must run in CI."
            exit 1
          fi
          if ! grep -Eq "Tests +[0-9]+ passed" isolation.log; then
            echo "::error::The tenant-isolation suite reported no passing tests."
            exit 1
          fi

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build
